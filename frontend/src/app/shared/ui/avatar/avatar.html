@if (imageUrl(); as url) {
  <img
    class="avatar"
    [style.width.px]="size()"
    [style.height.px]="size()"
    [src]="url"
    [alt]="'Foto de perfil de ' + name()"
  />
} @else {
  <div
    class="avatar avatar--initials"
    [style.width.px]="size()"
    [style.height.px]="size()"
    role="img"
    [attr.aria-label]="'Foto de perfil de ' + name()"
  >
    {{ initials() }}
  </div>
}
