<select
  class="ppam-select"
  [id]="inputId()"
  [disabled]="disabled() || isDisabled()"
  [value]="value() ?? ''"
  (change)="onSelectChange($any($event.target).value)"
  (blur)="onBlur()"
>
  <option value="" disabled>{{ placeholder() }}</option>
  @for (option of options(); track option.value) {
    <option [value]="option.value">{{ option.label }}</option>
  }
</select>
