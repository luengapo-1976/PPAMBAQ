<div class="proximamente">
  <a class="proximamente__back" routerLink="/inicio">
    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    <span>Volver al inicio</span>
  </a>

  <div class="proximamente__content">
    <span class="proximamente__icon material-symbols-outlined" aria-hidden="true">{{ icon() }}</span>
    <h1 class="proximamente__title">{{ title() }}</h1>
    <p class="proximamente__description">{{ description() || 'Esta sección estará disponible próximamente.' }}</p>
  </div>
</div>
