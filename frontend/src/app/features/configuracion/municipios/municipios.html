<div class="config-page">
  <app-config-table
    [rows]="municipios()"
    [columns]="columns()"
    [rowId]="rowId"
    searchPlaceholder="Buscar por código, nombre o departamento…"
    newRecordLabel="Nuevo registro"
    emptyMessage="No hay municipios que coincidan con el filtro actual."
    (newRecord)="onNewRecord()"
    (editRecord)="onEditRecord($event)"
  />
</div>

<app-municipio-form-dialog
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [record]="editingRecord()"
  [departamentos]="departamentos()"
  (closed)="onDialogClosed()"
  (saved)="onSaved()"
/>
