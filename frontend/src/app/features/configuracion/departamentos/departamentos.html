<div class="config-page">
  <app-config-table
    [rows]="departamentos()"
    [columns]="columns"
    [rowId]="rowId"
    searchPlaceholder="Buscar por código o nombre…"
    newRecordLabel="Nuevo registro"
    emptyMessage="No hay departamentos que coincidan con el filtro actual."
    (newRecord)="onNewRecord()"
    (editRecord)="onEditRecord($event)"
  />
</div>

<app-departamento-form-dialog
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [record]="editingRecord()"
  (closed)="onDialogClosed()"
  (saved)="onSaved()"
/>
