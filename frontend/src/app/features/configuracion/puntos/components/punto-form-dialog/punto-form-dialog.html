<app-dialog
  [open]="open()"
  [title]="dialogTitle()"
  position="right"
  rightWidth="40vw"
  panelBackground="var(--ppam-surface)"
  (closed)="onCancel()"
>
  <app-button
    dialogToolbar
    type="button"
    icon="save"
    [disabled]="form.invalid || saving()"
    (click)="onSave()"
  >
    Guardar
  </app-button>
  <app-button dialogToolbar type="button" variant="secondary" icon="close" (click)="onCancel()">
    Cancelar
  </app-button>
  <app-button dialogToolbar type="button" variant="ghost" icon="restart_alt" (click)="onClear()">
    Limpiar
  </app-button>

  <form class="form-grid" [formGroup]="form" (ngSubmit)="onSave()">
    <app-form-field label="Código" [required]="true" [control]="form.controls.codigo_punto">
      <input type="number" formControlName="codigo_punto" class="ppam-input" />
    </app-form-field>

    <app-form-field label="Nombre" [required]="true" [control]="form.controls.nombre_punto">
      <input type="text" formControlName="nombre_punto" class="ppam-input" maxlength="100" />
    </app-form-field>

    <app-form-field label="Tipo de punto" [required]="true" [control]="form.controls.tipo_punto">
      <app-select
        formControlName="tipo_punto"
        [options]="tipoPuntoOptions"
        placeholder="Seleccionar…"
      />
    </app-form-field>

    <app-form-field
      label="Dirección"
      [required]="true"
      [control]="form.controls.direccion"
      class="form-field--wide"
    >
      <input type="text" formControlName="direccion" class="ppam-input" maxlength="100" />
    </app-form-field>

    <app-form-field
      label="Departamento"
      [required]="true"
      [control]="form.controls.codigo_departamento"
    >
      <app-search-select
        formControlName="codigo_departamento"
        [options]="departamentoOptions()"
        placeholder="Buscar departamento…"
      />
    </app-form-field>

    <app-form-field label="Municipio" [required]="true" [control]="form.controls.codigo_municipio">
      <app-search-select
        formControlName="codigo_municipio"
        [options]="municipioOptions()"
        placeholder="Buscar municipio…"
      />
    </app-form-field>

    <app-form-field label="Encargado" [required]="true" [control]="form.controls.encargado">
      <input type="text" formControlName="encargado" class="ppam-input" maxlength="100" />
    </app-form-field>

    <app-form-field label="Móvil" [required]="true" [control]="form.controls.movil">
      <input
        type="tel"
        formControlName="movil"
        class="ppam-input"
        maxlength="10"
        inputmode="numeric"
      />
    </app-form-field>

    <app-form-field label="Estado" [required]="true" [control]="form.controls.estado">
      <app-select formControlName="estado" [options]="estadoOptions" placeholder="Seleccionar…" />
    </app-form-field>
  </form>
</app-dialog>
