<div class="config-page">
  <app-config-table
    [rows]="congregaciones()"
    [columns]="columns()"
    [rowId]="rowId"
    searchPlaceholder="Buscar por código, nombre, municipio, departamento o circuito…"
    newRecordLabel="Nuevo registro"
    emptyMessage="No hay congregaciones que coincidan con el filtro actual."
    (newRecord)="onNewRecord()"
    (editRecord)="onEditRecord($event)"
  />
</div>

<app-congregacion-form-dialog
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [record]="editingRecord()"
  [departamentos]="departamentos()"
  [municipios]="municipios()"
  [circuitos]="circuitos()"
  (closed)="onDialogClosed()"
  (saved)="onSaved()"
/>
