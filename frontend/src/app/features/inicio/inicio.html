<div class="inicio">
  <header class="inicio__topbar">
    <div class="inicio__brand">
      <img class="inicio__brand-logo" src="images/LOGO.png" alt="" />
      <span class="inicio__brand-text">PPAM BAQ</span>
    </div>
    <div class="inicio__topbar-end">
      @if (showRoleSwitch()) {
        <app-role-switch [active]="vistaActiva()" (changed)="onSwitchVista($event)" />
      }
      <app-avatar [name]="nombre()" [size]="36" />
      <button type="button" class="inicio__logout" (click)="onLogout()">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <section class="inicio__greeting">
    <h1 class="inicio__greeting-title">Hola, {{ nombre() }}</h1>
    <p class="inicio__greeting-subtitle">¿Qué deseas hacer hoy?</p>
  </section>

  <nav class="inicio__menu" aria-label="Menú principal">
    @for (item of mainItems; track item.id) {
      <a class="menu-item" [routerLink]="item.route">
        <span class="menu-item__icon material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
        <span class="menu-item__body">
          <span class="menu-item__title">{{ item.title }}</span>
          <span class="menu-item__description">{{ item.description }}</span>
        </span>
        <span class="menu-item__chevron material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </a>
    }

    <div class="inicio__menu-divider" aria-hidden="true"></div>

    <a class="menu-item menu-item--sensitive" [routerLink]="bajaItem.route">
      <span class="menu-item__icon material-symbols-outlined" aria-hidden="true">{{ bajaItem.icon }}</span>
      <span class="menu-item__body">
        <span class="menu-item__title">{{ bajaItem.title }}</span>
        <span class="menu-item__description">{{ bajaItem.description }}</span>
      </span>
      <span class="menu-item__chevron material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </a>
  </nav>
</div>
