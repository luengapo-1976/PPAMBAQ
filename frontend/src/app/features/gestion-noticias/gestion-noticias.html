<div class="gestion-noticias-page">
  <div class="gestion-noticias-page__toolbar">
    <app-button icon="add" (click)="onNewRecord()">Nueva noticia</app-button>
  </div>

  <section class="gestion-noticias-page__grid">
    <app-noticias-table
      [rows]="noticias()"
      (editRecord)="onEditRecord($event)"
      (toggleEstado)="onToggleEstado($event)"
      (moveUp)="onMoveUp($event)"
      (moveDown)="onMoveDown($event)"
      (deleteRecord)="onDeleteRecord($event)"
    />
  </section>
</div>

<app-noticia-form
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [record]="editingRecord()"
  (closed)="onDialogClosed()"
  (saved)="onSaved()"
/>
