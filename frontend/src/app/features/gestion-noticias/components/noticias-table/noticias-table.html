<div class="table-scroll">
  <table class="ppam-table">
    <thead>
      <tr>
        <th>Acciones</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Fecha de publicación</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <td>
            <button
              type="button"
              class="ppam-table__edit-btn"
              [attr.aria-label]="'Editar noticia ' + row.titulo"
              title="Editar registro"
              (click)="editRecord.emit(row)"
            >
              <span class="material-symbols-outlined" aria-hidden="true">edit</span>
            </button>
          </td>
          <td>{{ row.titulo }}</td>
          <td>
            <app-badge [tone]="row.estado === 'PUBLICADA' ? 'success' : 'neutral'">{{ row.estado }}</app-badge>
          </td>
          <td>{{ row.fecha_publicacion ? formatDateShort(row.fecha_publicacion) : '—' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="ppam-table__empty">Todavía no hay noticias registradas.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
