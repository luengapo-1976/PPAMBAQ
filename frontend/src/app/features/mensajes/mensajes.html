<div class="mensajes-page">
  <app-mensaje-form
    [tipos]="tipos()"
    [editingRecord]="editingRecord()"
    (saved)="onSaved()"
    (cancelEdit)="onCancelEdit()"
  />

  <section class="mensajes-page__grid">
    <app-mensajes-table [rows]="mensajes()" (editRecord)="onEditRecord($event)" />
  </section>
</div>
