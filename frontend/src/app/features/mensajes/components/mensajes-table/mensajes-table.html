<div class="table-scroll">
  <table class="ppam-table">
    <thead>
      <tr>
        <th>Acciones</th>
        <th>Tipo</th>
        <th>Mensaje</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <td>
            <button
              type="button"
              class="ppam-table__edit-btn"
              [attr.aria-label]="'Editar mensaje de tipo ' + row.tipo"
              title="Editar registro"
              (click)="editRecord.emit(row)"
            >
              <span class="material-symbols-outlined" aria-hidden="true">edit</span>
            </button>
          </td>
          <td class="ppam-table__tipo">{{ row.tipo }}</td>
          <td class="ppam-table__mensaje">{{ row.mensaje }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="ppam-table__empty">Todavía no hay mensajes registrados.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
