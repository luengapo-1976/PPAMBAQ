<div class="estado-summary">
  <div class="summary-card" [class.summary-card--active]="activeCards().has('total')">
    <button
      type="button"
      class="summary-card__header"
      [attr.aria-pressed]="activeCards().has('total')"
      (click)="toggleCard.emit('total')"
    >
      <span class="summary-card__icon">
        <span class="material-symbols-outlined" aria-hidden="true">groups</span>
      </span>
      <span class="summary-card__text">
        <span class="summary-card__count">{{ countTotal() }}</span>
        <span class="summary-card__label">Total</span>
      </span>
    </button>
    <div class="summary-card__options" [class.summary-card__options--disabled]="!activeCards().has('total')"></div>
  </div>

  <div class="summary-card" [class.summary-card--active]="activeCards().has('pendiente1')">
    <button
      type="button"
      class="summary-card__header"
      [attr.aria-pressed]="activeCards().has('pendiente1')"
      (click)="toggleCard.emit('pendiente1')"
    >
      <span class="summary-card__icon">
        <span class="material-symbols-outlined" aria-hidden="true">how_to_reg</span>
      </span>
      <span class="summary-card__text">
        <span class="summary-card__count">{{ countPendiente1() }}</span>
        <span class="summary-card__label">Pendiente 1er entrenamiento</span>
      </span>
    </button>
    <div
      class="summary-card__options"
      [class.summary-card__options--disabled]="!activeCards().has('pendiente1')"
      role="radiogroup"
      aria-label="Filtro Pendiente 1er entrenamiento"
    >
      @for (opt of pendienteSubOptions; track opt.value) {
        <label class="summary-card__option">
          <input
            type="radio"
            name="sub-pendiente1"
            [checked]="subOptionPendiente1() === opt.value"
            [disabled]="!activeCards().has('pendiente1')"
            (change)="subOptionPendiente1Change.emit(opt.value)"
          />
          {{ opt.label }}
        </label>
      }
    </div>
  </div>

  <div class="summary-card" [class.summary-card--active]="activeCards().has('pendiente2')">
    <button
      type="button"
      class="summary-card__header"
      [attr.aria-pressed]="activeCards().has('pendiente2')"
      (click)="toggleCard.emit('pendiente2')"
    >
      <span class="summary-card__icon">
        <span class="material-symbols-outlined" aria-hidden="true">campaign</span>
      </span>
      <span class="summary-card__text">
        <span class="summary-card__count">{{ countPendiente2() }}</span>
        <span class="summary-card__label">Pendiente 2do entrenamiento</span>
      </span>
    </button>
    <div
      class="summary-card__options"
      [class.summary-card__options--disabled]="!activeCards().has('pendiente2')"
      role="radiogroup"
      aria-label="Filtro Pendiente 2do entrenamiento"
    >
      @for (opt of pendienteSubOptions; track opt.value) {
        <label class="summary-card__option">
          <input
            type="radio"
            name="sub-pendiente2"
            [checked]="subOptionPendiente2() === opt.value"
            [disabled]="!activeCards().has('pendiente2')"
            (change)="subOptionPendiente2Change.emit(opt.value)"
          />
          {{ opt.label }}
        </label>
      }
    </div>
  </div>

  <div class="summary-card" [class.summary-card--active]="activeCards().has('cumple')">
    <button
      type="button"
      class="summary-card__header"
      [attr.aria-pressed]="activeCards().has('cumple')"
      (click)="toggleCard.emit('cumple')"
    >
      <span class="summary-card__icon">
        <span class="material-symbols-outlined" aria-hidden="true">verified</span>
      </span>
      <span class="summary-card__text">
        <span class="summary-card__count">{{ countCumple() }}</span>
        <span class="summary-card__label">Cumple requisitos</span>
      </span>
    </button>
    <div
      class="summary-card__options"
      [class.summary-card__options--disabled]="!activeCards().has('cumple')"
      role="radiogroup"
      aria-label="Filtro Cumple requisitos"
    >
      @for (opt of cumpleSubOptions; track opt.value) {
        <label class="summary-card__option">
          <input
            type="radio"
            name="sub-cumple"
            [checked]="subOptionCumple() === opt.value"
            [disabled]="!activeCards().has('cumple')"
            (change)="subOptionCumpleChange.emit(opt.value)"
          />
          {{ opt.label }}
        </label>
      }
    </div>
  </div>
</div>
