<div class="solicitudes-page">
  <app-estado-summary
    [publicadores]="publicadores()"
    [activeCards]="activeCards()"
    [subOptionPendiente1]="subOptionPendiente1()"
    [subOptionPendiente2]="subOptionPendiente2()"
    [subOptionCumple]="subOptionCumple()"
    (toggleCard)="toggleCard($event)"
    (subOptionPendiente1Change)="subOptionPendiente1.set($event)"
    (subOptionPendiente2Change)="subOptionPendiente2.set($event)"
    (subOptionCumpleChange)="subOptionCumple.set($event)"
  />

  @if (entrenamientoFilterVisible()) {
    <app-entrenamiento-filter
      [allPublicadores]="publicadores()"
      [filteredRows]="gridRows()"
      [puntos]="puntos()"
      [departamentos]="departamentos()"
      [municipios]="municipios()"
      [filtro]="entrenamientoFiltro()"
      (filtroChange)="entrenamientoFiltro.set($event)"
      (closed)="entrenamientoFilterVisible.set(false)"
    />
  } @else {
    <div class="solicitudes-page__checklist-toggle">
      <app-button variant="secondary" icon="fact_check" (click)="onToggleEntrenamientoFilter()">
        Lista de chequeo
      </app-button>
    </div>
  }

  <section class="solicitudes-page__grid">
    <app-publicadores-table
      [rows]="gridRows()"
      [cumpleRequisitosActive]="activeCards().has('cumple')"
      (newRecord)="onNewRecord()"
      (editRecord)="onEditRecord($event)"
      (viewActions)="onViewActions($event)"
    />
  </section>
</div>

<app-publicador-form-dialog
  [open]="dialogOpen()"
  [mode]="dialogMode()"
  [record]="editingRecord()"
  [departamentos]="departamentos()"
  [municipios]="municipios()"
  [congregaciones]="congregaciones()"
  [existingPublicadores]="publicadores()"
  [puntos]="puntos()"
  (closed)="onDialogClosed()"
  (saved)="onSaved()"
/>

<app-asignar-lugar-panel
  [open]="activeAccion() === 'asignar-lugar'"
  [selectedPublicadorIds]="accionesSelectedIds()"
  [rightOffset]="accionesBarWidth()"
  (closed)="onAccionPanelClosed()"
  (saved)="onSaved()"
/>

<app-enviar-mensaje-panel
  [open]="activeAccion() === 'enviar-mensaje'"
  [selectedPublicadorIds]="accionesSelectedIds()"
  [publicadores]="publicadores()"
  [puntos]="puntos()"
  [rightOffset]="accionesBarWidth()"
  (closed)="onAccionPanelClosed()"
  (sent)="onSaved()"
/>

<app-acciones-bar
  [open]="accionesBarOpen()"
  [collapsed]="accionesBarCollapsed()"
  (collapsedChange)="accionesBarCollapsed.set($event)"
  (closed)="onAccionesBarClosed()"
  (selectAsignarLugar)="activeAccion.set('asignar-lugar')"
  (selectEnviarMensaje)="activeAccion.set('enviar-mensaje')"
/>
