<div class="ppam-navbar">
  <div class="ppam-navbar__identity-wrap">
    <header class="ppam-navbar__identity">
      <a class="ppam-navbar__brand" routerLink="/inicio">
        <img class="ppam-navbar__logo" src="images/LOGO.png" alt="" />
        <span class="ppam-navbar__brand-text">PPAM BAQ</span>
      </a>

      <div class="ppam-navbar__identity-end">
        @if (showRoleSwitch()) {
          <app-role-switch
            [active]="vistaActiva()"
            [compact]="true"
            (changed)="onSwitchVista($event)"
          />
        }
        @if (encargadoPunto.esEncargado()) {
          <button
            type="button"
            class="ppam-navbar__icon-btn"
            aria-label="Ver el calendario de mi punto"
            (click)="onAbrirCalendarioEncargado()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
          </button>
        }
        <div class="ppam-navbar__account">
          <button
            type="button"
            class="ppam-navbar__avatar-trigger"
            [attr.aria-expanded]="menuOpen()"
            aria-haspopup="menu"
            aria-label="Abrir menú de cuenta"
            (click)="toggleMenu()"
          >
            <app-avatar [name]="nombre()" [size]="32" />
          </button>
        </div>
      </div>
    </header>

    @if (menuOpen()) {
      <!-- Fuera de <header>: ese elemento tiene backdrop-filter, que en Chromium
    hace que el contenido de un descendiente en position:absolute que se
    extiende más allá de su propio borde se pinte mal (se ve "recortado"/en
    blanco). Como hermano de <header>, el menú no hereda ese problema. -->
      <ul class="ppam-navbar__menu" role="menu">
        <li role="none">
          <button
            type="button"
            role="menuitem"
            class="ppam-navbar__menu-item"
            (click)="onChangePassword()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
            <span>Cambiar contraseña</span>
          </button>
        </li>
        <li role="none">
          <button type="button" role="menuitem" class="ppam-navbar__menu-item" (click)="onLogout()">
            <span class="material-symbols-outlined" aria-hidden="true">logout</span>
            <span>Cerrar sesión</span>
          </button>
        </li>
      </ul>
    }
  </div>

  <div class="ppam-navbar__titlebar">
    <h1 class="ppam-navbar__title">{{ title() }}</h1>
    @if (fullscreenSupported) {
      <button
        type="button"
        class="ppam-navbar__icon-btn ppam-navbar__icon-btn--trailing"
        (click)="onToggleFullscreen()"
        [attr.aria-label]="
          isFullscreen() ? 'Salir de pantalla completa' : 'Ver en pantalla completa'
        "
      >
        <span class="material-symbols-outlined" aria-hidden="true">
          {{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}
        </span>
      </button>
    }
  </div>
</div>

<app-change-password-dialog
  [open]="changePasswordOpen()"
  (closed)="changePasswordOpen.set(false)"
/>
